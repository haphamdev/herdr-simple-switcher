id = "simple-switcher"
name = "Simple Switcher"
version = "0.1.0"
min_herdr_version = "0.7.0"
description = "Fuzzy switch between workspaces, tabs, and agents with fzf"
platforms = ["linux", "macos"]

[[panes]]
id = "switch-tab"
title = "Switch Tab"
placement = "overlay"
command = ["bash", "scripts/switch-tab.sh"]

[[panes]]
id = "switch-workspace"
title = "Switch Workspace"
placement = "overlay"
command = ["bash", "scripts/switch-workspace.sh"]

[[panes]]
id = "switch-agent"
title = "Switch Agent"
placement = "overlay"
command = ["bash", "scripts/switch-agent.sh"]
