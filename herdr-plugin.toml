id = "simple-switcher"
name = "Simple Switcher"
version = "0.3.0"
min_herdr_version = "0.7.0"
description = "Fuzzy switch between workspaces, tabs, agents, and projects with fzf"
platforms = ["linux", "macos"]

[[startup]]
command = ["bash", "scripts/startup-check.sh"]

[[panes]]
id = "switch-tab"
title = "Switch Tab"
placement = "popup"
command = ["bash", "scripts/switch-tab.sh"]

[[panes]]
id = "switch-workspace"
title = "Switch Workspace"
placement = "popup"
command = ["bash", "scripts/switch-workspace.sh"]

[[panes]]
id = "switch-agent"
title = "Switch Agent"
placement = "popup"
command = ["bash", "scripts/switch-agent.sh"]

[[panes]]
id = "open-project"
title = "Open Project"
placement = "popup"
command = ["bash", "scripts/open-project.sh"]
